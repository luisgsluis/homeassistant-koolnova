name: Validate

# HACS and hassfest only. The tests live in tests.yml, without a schedule: GitHub disables a
# scheduled workflow after 60 days without activity, push and pull_request triggers included.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # "brands" would require being listed in home-assistant/brands, which no
          # longer accepts custom integrations. This one ships its own images under
          # custom_components/koolnova/brand/, so the check is skipped.
          ignore: brands

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the only runtime dependency of the vendored client
        run: pip install requests
      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v

  tests-ha:
    name: Tests (Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/workflows/tests.yml
      # Same version as the minimum in hacs.json
      - name: Install Home Assistant
        run: pip install homeassistant==2026.11.0
      # One process per module: some modules stub custom_components in sys.modules.
      # A module that still skips for lack of Home Assistant fails the job.
      - name: Run every test module against Home Assistant
        run: |
          fail=0
          for f in tests/test_*.py; do
            m=$(basename "$f" .py)
            echo "::group::$m"
            out=$(python -m unittest "tests.$m" -v 2>&1); rc=$?
            echo "$out"
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then echo "::error::$m failed"; fail=1; fi
            if echo "$out" | grep -q "skipped 'needs Home Assistant'"; then echo "::error::$m skipped its Home Assistant tests"; fail=1; fi
          done
          exit $fail
